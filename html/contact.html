<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — controlsfreak.dev</title>
    <meta name="description" content="Get in touch with controlsfreak.dev — bug reports, tool requests, and feedback on these building-controls field tools.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Overpass:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Page-specific — only this page uses these. The shared design system
           lives in /styles.css; these few rules ride along inline so they stay
           next to the markup they belong to. */
        .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .contact-intro {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text);
            max-width: 560px;
            margin-bottom: 1.5rem;
        }
        #contact-result-value { font-size: 1.15rem; line-height: 1.5; }
    </style>
</head>
<body>

<nav class="site-nav">
    <a class="site-nav-brand" href="/">controlsfreak<span>.dev</span></a>
    <div class="site-nav-links">
        <a href="/">Home</a>
        <a href="/tools/">Tools</a>
        <a href="/education/pid-basics.html">Education</a>
        <a href="/contact.html" class="active">Contact</a>
    </div>
</nav>

<main>

    <section class="section-header">
        <span class="section-label">Contact</span>
        <span class="section-line"></span>
    </section>

    <div class="tool-card">
        <div class="tool-card-header">
            <div class="tool-card-title">
                Get in touch
                <span class="tool-tag">Contact</span>
            </div>
        </div>
        <div class="tool-body">

            <p class="contact-intro">
                Found a bug, want a tool added, or have feedback on something here? Send a note — replies go straight to your inbox, not into a black hole.
            </p>

            <form id="contact-form" onsubmit="submitContact(event)">
                <div class="form-row">
                    <div class="field">
                        <label for="contact-name">Name (optional)</label>
                        <input type="text" id="contact-name" name="name" maxlength="200">
                    </div>
                    <div class="field">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="email" required maxlength="200">
                    </div>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" required maxlength="5000" rows="8"></textarea>
                    </div>
                </div>

                <!-- Honeypot: off-screen via CSS, named to tempt bots; humans never see it -->
                <div class="hp-field" aria-hidden="true">
                    <label for="contact-website">Website</label>
                    <input type="text" id="contact-website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <!-- Cloudflare Turnstile  -->
                <div class="cf-turnstile" data-sitekey="0x4AAAAAADMxtgbuzZieosAM" data-theme="light" style="margin-bottom:1rem;"></div>

                <div class="btn-row">
                    <button type="submit" class="copy-btn">Send message</button>
                </div>
            </form>

            <div id="contact-result" class="result-panel" style="display:none">
                <div class="result-label">Status</div>
                <div class="result-value" id="contact-result-value">—</div>
            </div>

        </div>
    </div>

</main>

<footer>
    <span class="footer-text">controlsfreak.dev — open tools for controls engineers</span>
    <span class="footer-text">v0.4 · 2026</span>
</footer>

<script>
    async function submitContact(e) {
        e.preventDefault();
        const form = document.getElementById("contact-form");
        const result = document.getElementById("contact-result");
        const resultValue = document.getElementById("contact-result-value");
        const submitBtn = form.querySelector("button[type=submit]");

        // Show pending state
        result.style.display = "";
        resultValue.className = "result-value muted";
        resultValue.textContent = "Sending…";
        submitBtn.disabled = true;

        try {
            const formData = new FormData(form);
            const res = await fetch("/api/contact", {
                method: "POST",
                body: new URLSearchParams(formData)
            });
            const data = await res.json();
            if (data.ok) {
                resultValue.className = "result-value";
                resultValue.textContent = "Message sent. Thanks!";
                form.reset();
                // Reset Turnstile so a second submission gets a fresh token
                if (window.turnstile) window.turnstile.reset();
            } else {
                resultValue.className = "result-value error";
                resultValue.textContent = data.error || "Something went wrong.";
            }
        } catch (err) {
            resultValue.className = "result-value error";
            resultValue.textContent = "Network error. Please try again.";
        } finally {
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
